networks:
  orynx-edge:
    driver: bridge
  orynx-backend:
    driver: bridge
  orynx-monitoring:
    driver: bridge
    ipam:
      config:
        - subnet: ${ORYNX_MONITORING_SUBNET:-172.29.22.0/24}

volumes:
  orynx_postgres_data:
  orynx_kafka_data:
  orynx_redis_data:
  orynx_prometheus_data:
  orynx_tempo_data:
  orynx_grafana_data:

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orynx}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_MONITOR_USER: ${POSTGRES_MONITOR_USER:-orynx_monitor}
      POSTGRES_MONITOR_PASSWORD: ${POSTGRES_MONITOR_PASSWORD:-}
    volumes:
      - orynx_postgres_data:/var/lib/postgresql/data
      - ./monitoring/postgres/ensure-monitoring-user.sh:/usr/local/bin/ensure-monitoring-user.sh:ro
    expose:
      - "5432"
    networks:
      - orynx-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-orynx} && (tr -d '\\r' < /usr/local/bin/ensure-monitoring-user.sh | sh)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - orynx_redis_data:/data
    expose:
      - "6379"
    networks:
      - orynx-backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  kafka:
    image: apache/kafka:latest
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - orynx_kafka_data:/var/lib/kafka/data
    expose:
      - "9092"
    networks:
      - orynx-backend
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 25s

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-orynx}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      SPRING_PROFILES_ACTIVE: docker
      ORYNX_OBSERVABILITY_METRICS_ENABLED: "true"
      ORYNX_OBSERVABILITY_METRICS_PORT: "9100"
      ORYNX_OBSERVABILITY_METRICS_NETWORK_PREFIX: ${ORYNX_MONITORING_NETWORK_PREFIX:-172.29.22.}
      OTEL_JAVAAGENT_ENABLED: ${OTEL_JAVAAGENT_ENABLED:-true}
      OTEL_SERVICE_NAME: auth-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_INSTRUMENTATION_KAFKA_EXPERIMENTAL_SPAN_ATTRIBUTES: "true"
      OTEL_INSTRUMENTATION_SPRING_SCHEDULING_ENABLED: "false"
      OTEL_INSTRUMENTATION_HIBERNATE_ENABLED: "false"
      OTEL_INSTRUMENTATION_SPRING_DATA_ENABLED: "false"
      JAVA_OPTS: ${JAVA_OPTS:--XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0}
    expose:
      - "8081"
      - "9100"
    networks:
      - orynx-backend
      - orynx-monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/actuator/health/readiness"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s

  planning-service:
    build:
      context: ./services/planning-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:?NVIDIA_API_KEY is required}
      SPRING_PROFILES_ACTIVE: docker
      ORYNX_OBSERVABILITY_METRICS_ENABLED: "true"
      ORYNX_OBSERVABILITY_METRICS_PORT: "9100"
      ORYNX_OBSERVABILITY_METRICS_NETWORK_PREFIX: ${ORYNX_MONITORING_NETWORK_PREFIX:-172.29.22.}
      OTEL_JAVAAGENT_ENABLED: ${OTEL_JAVAAGENT_ENABLED:-true}
      OTEL_SERVICE_NAME: planning-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_INSTRUMENTATION_SPRING_SCHEDULING_ENABLED: "false"
      JAVA_OPTS: ${JAVA_OPTS:--XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0}
    expose:
      - "8083"
      - "9100"
    networks:
      - orynx-backend
      - orynx-monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8083/actuator/health/readiness"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 35s

  orchestrator-service:
    build:
      context: ./services/orchestrator-service
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-orynx}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PLANNING_SERVICE_URL: http://planning-service:8083
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:?NVIDIA_API_KEY is required}
      WEBSOCKET_ALLOWED_ORIGINS: ${WEBSOCKET_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      SPRING_PROFILES_ACTIVE: docker
      ORYNX_OBSERVABILITY_METRICS_ENABLED: "true"
      ORYNX_OBSERVABILITY_METRICS_PORT: "9100"
      ORYNX_OBSERVABILITY_METRICS_NETWORK_PREFIX: ${ORYNX_MONITORING_NETWORK_PREFIX:-172.29.22.}
      OTEL_JAVAAGENT_ENABLED: ${OTEL_JAVAAGENT_ENABLED:-true}
      OTEL_SERVICE_NAME: orchestrator-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_INSTRUMENTATION_KAFKA_EXPERIMENTAL_SPAN_ATTRIBUTES: "true"
      OTEL_INSTRUMENTATION_SPRING_SCHEDULING_ENABLED: "false"
      OTEL_INSTRUMENTATION_HIBERNATE_ENABLED: "false"
      OTEL_INSTRUMENTATION_SPRING_DATA_ENABLED: "false"
      JAVA_OPTS: ${JAVA_OPTS:--XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0}
    expose:
      - "8082"
      - "9100"
    networks:
      - orynx-backend
      - orynx-monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/actuator/health/readiness"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s

  execution-service:
    build:
      context: ./services/execution-service
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-orynx}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ORYNX_EXECUTION_WORKER_CORE_POOL_SIZE: ${ORYNX_EXECUTION_WORKER_CORE_POOL_SIZE:-4}
      ORYNX_EXECUTION_WORKER_MAX_POOL_SIZE: ${ORYNX_EXECUTION_WORKER_MAX_POOL_SIZE:-8}
      ORYNX_EXECUTION_WORKER_QUEUE_CAPACITY: ${ORYNX_EXECUTION_WORKER_QUEUE_CAPACITY:-50}
      SPRING_PROFILES_ACTIVE: docker
      ORYNX_OBSERVABILITY_METRICS_ENABLED: "true"
      ORYNX_OBSERVABILITY_METRICS_PORT: "9100"
      ORYNX_OBSERVABILITY_METRICS_NETWORK_PREFIX: ${ORYNX_MONITORING_NETWORK_PREFIX:-172.29.22.}
      OTEL_JAVAAGENT_ENABLED: ${OTEL_JAVAAGENT_ENABLED:-true}
      OTEL_SERVICE_NAME: execution-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_INSTRUMENTATION_KAFKA_EXPERIMENTAL_SPAN_ATTRIBUTES: "true"
      OTEL_INSTRUMENTATION_SPRING_SCHEDULING_ENABLED: "false"
      OTEL_INSTRUMENTATION_HIBERNATE_ENABLED: "false"
      OTEL_INSTRUMENTATION_SPRING_DATA_ENABLED: "false"
      JAVA_OPTS: ${JAVA_OPTS:--XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0}
    expose:
      - "8084"
      - "9100"
    networks:
      - orynx-backend
      - orynx-monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8084/actuator/health/readiness"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s

  gateway-service:
    build:
      context: ./services/gateway-service
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_healthy
      orchestrator-service:
        condition: service_healthy
      planning-service:
        condition: service_healthy
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      ORCHESTRATOR_SERVICE_URL: http://orchestrator-service:8082
      PLANNING_SERVICE_URL: http://planning-service:8083
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SPRING_PROFILES_ACTIVE: docker
      ORYNX_OBSERVABILITY_METRICS_ENABLED: "true"
      ORYNX_OBSERVABILITY_METRICS_PORT: "9100"
      ORYNX_OBSERVABILITY_METRICS_NETWORK_PREFIX: ${ORYNX_MONITORING_NETWORK_PREFIX:-172.29.22.}
      OTEL_JAVAAGENT_ENABLED: ${OTEL_JAVAAGENT_ENABLED:-true}
      OTEL_SERVICE_NAME: gateway-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_INSTRUMENTATION_SPRING_SCHEDULING_ENABLED: "false"
      JAVA_OPTS: ${JAVA_OPTS:--XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0}
    ports:
      - "8080:8080"
    expose:
      - "9100"
    networks:
      - orynx-edge
      - orynx-backend
      - orynx-monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 35s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
        NEXT_PUBLIC_WS_BASE_URL: ${NEXT_PUBLIC_WS_BASE_URL:-http://localhost:8080}
    restart: unless-stopped
    depends_on:
      gateway-service:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - orynx-edge
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  tempo:
    image: grafana/tempo:2.6.1
    profiles: ["observability"]
    restart: unless-stopped
    mem_limit: ${TEMPO_MEM_LIMIT:-512m}
    cpus: ${TEMPO_CPU_LIMIT:-1.0}
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./monitoring/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - orynx_tempo_data:/var/tempo
    expose:
      - "3200"
      - "4317"
      - "4318"
    ports:
      - "127.0.0.1:3200:3200"
    networks:
      - orynx-monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3200/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  otel-collector:
    build:
      context: ./monitoring/otel
      dockerfile: Dockerfile
    image: orynx-otel-collector:0.114.0
    profiles: ["observability"]
    restart: unless-stopped
    mem_limit: ${OTEL_COLLECTOR_MEM_LIMIT:-384m}
    cpus: ${OTEL_COLLECTOR_CPU_LIMIT:-0.5}
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    depends_on:
      tempo:
        condition: service_healthy
    volumes:
      - ./monitoring/otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    expose:
      - "4317"
      - "4318"
      - "8888"
      - "13133"
    networks:
      - orynx-monitoring
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:13133/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    profiles: ["observability"]
    restart: on-failure:2
    mem_limit: ${EXPORTER_MEM_LIMIT:-128m}
    cpus: ${EXPORTER_CPU_LIMIT:-0.25}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orynx}
      POSTGRES_MONITOR_USER: ${POSTGRES_MONITOR_USER:-orynx_monitor}
      POSTGRES_MONITOR_PASSWORD: ${POSTGRES_MONITOR_PASSWORD:-}
    entrypoint:
      - "/bin/sh"
      - "-c"
      - |
        if [ -z "$${POSTGRES_MONITOR_PASSWORD}" ]; then
          echo "ERROR: POSTGRES_MONITOR_PASSWORD is required when starting the observability profile." >&2
          exit 1
        fi
        export DATA_SOURCE_NAME="postgresql://$${POSTGRES_MONITOR_USER:-orynx_monitor}:$${POSTGRES_MONITOR_PASSWORD}@postgres:5432/$${POSTGRES_DB:-orynx}?sslmode=disable"
        exec /bin/postgres_exporter
    expose:
      - "9187"
    networks:
      - orynx-backend
      - orynx-monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9187/metrics"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0-alpine
    profiles: ["observability"]
    restart: unless-stopped
    mem_limit: ${EXPORTER_MEM_LIMIT:-128m}
    cpus: ${EXPORTER_CPU_LIMIT:-0.25}
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_ADDR: "redis://redis:6379"
    expose:
      - "9121"
    networks:
      - orynx-backend
      - orynx-monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9121/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    profiles: ["observability"]
    restart: unless-stopped
    mem_limit: ${EXPORTER_MEM_LIMIT:-128m}
    cpus: ${EXPORTER_CPU_LIMIT:-0.25}
    depends_on:
      kafka:
        condition: service_healthy
    command: ["--kafka.server=kafka:9092"]
    expose:
      - "9308"
    networks:
      - orynx-backend
      - orynx-monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9308/metrics"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    restart: unless-stopped
    mem_limit: ${PROMETHEUS_MEM_LIMIT:-512m}
    cpus: ${PROMETHEUS_CPU_LIMIT:-1.0}
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - orynx_prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - orynx-monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  grafana:
    image: grafana/grafana:11.3.1
    profiles: ["observability"]
    restart: on-failure:2
    mem_limit: ${GRAFANA_MEM_LIMIT:-256m}
    cpus: ${GRAFANA_CPU_LIMIT:-0.5}
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    entrypoint:
      - "/bin/sh"
      - "-c"
      - |
        if [ -z "$${GRAFANA_ADMIN_PASSWORD}" ]; then
          echo "ERROR: GRAFANA_ADMIN_PASSWORD is required when starting the observability profile." >&2
          exit 1
        fi
        export GF_SECURITY_ADMIN_PASSWORD="$${GRAFANA_ADMIN_PASSWORD}"
        exec /run.sh
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - orynx_grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - orynx-monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
