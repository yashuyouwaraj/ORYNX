groups:
  # ============================================================================
  # 1. API SLIs, SLO Targets, Error Budgets & Burn Rates
  #    Target Availability: 99.9% (0.999) | Error Budget: 0.1% (0.001)
  #    Target P95 Latency:  0.5s (500ms) excluding /actuator/health*
  # ============================================================================
  - name: orynx_api_sli_rules
    interval: 15s
    rules:
      - record: orynx:api:slo_target_availability
        expr: vector(0.999)

      - record: orynx:api:slo_target_p95_seconds
        expr: vector(0.5)

      - record: orynx:api:requests:rate5m
        expr: >-
          sum(rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[5m]))
          or vector(0)

      - record: orynx:api:requests:rate5m_by_service
        expr: >-
          sum by (application) (rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[5m]))

      - record: orynx:api:errors:rate5m
        expr: >-
          sum(rate(http_server_requests_seconds_count{uri!~"/actuator.*",outcome="SERVER_ERROR"}[5m]))
          or vector(0)

      - record: orynx:api:errors:rate5m_by_service
        expr: >-
          sum by (application) (rate(http_server_requests_seconds_count{uri!~"/actuator.*",outcome="SERVER_ERROR"}[5m]))
          or (0 * sum by (application) (rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[5m])))

      # Multi-window API error ratios (0 when idle so idle periods do not trigger false alerts)
      - record: orynx:api:error_ratio:rate5m
        expr: >-
          clamp_max(
            (sum(rate(http_server_requests_seconds_count{uri!~"/actuator.*",outcome="SERVER_ERROR"}[5m])) or vector(0))
            /
            clamp_min((sum(rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[5m])) or vector(0)), 1e-12),
            1
          )

      - record: orynx:api:error_ratio:rate30m
        expr: >-
          clamp_max(
            (sum(rate(http_server_requests_seconds_count{uri!~"/actuator.*",outcome="SERVER_ERROR"}[30m])) or vector(0))
            /
            clamp_min((sum(rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[30m])) or vector(0)), 1e-12),
            1
          )

      - record: orynx:api:error_ratio:rate1h
        expr: >-
          clamp_max(
            (sum(rate(http_server_requests_seconds_count{uri!~"/actuator.*",outcome="SERVER_ERROR"}[1h])) or vector(0))
            /
            clamp_min((sum(rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[1h])) or vector(0)), 1e-12),
            1
          )

      - record: orynx:api:error_ratio:rate6h
        expr: >-
          clamp_max(
            (sum(rate(http_server_requests_seconds_count{uri!~"/actuator.*",outcome="SERVER_ERROR"}[6h])) or vector(0))
            /
            clamp_min((sum(rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[6h])) or vector(0)), 1e-12),
            1
          )

      - record: orynx:api:error_ratio:rate24h
        expr: >-
          clamp_max(
            (sum(rate(http_server_requests_seconds_count{uri!~"/actuator.*",outcome="SERVER_ERROR"}[24h])) or vector(0))
            /
            clamp_min((sum(rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[24h])) or vector(0)), 1e-12),
            1
          )

      - record: orynx:api:error_ratio:rate7d
        expr: >-
          clamp_max(
            (sum(rate(http_server_requests_seconds_count{uri!~"/actuator.*",outcome="SERVER_ERROR"}[7d])) or vector(0))
            /
            clamp_min((sum(rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[7d])) or vector(0)), 1e-12),
            1
          )

      - record: orynx:api:error_ratio:rate30d
        expr: >-
          clamp_max(
            (sum(rate(http_server_requests_seconds_count{uri!~"/actuator.*",outcome="SERVER_ERROR"}[30d])) or vector(0))
            /
            clamp_min((sum(rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[30d])) or vector(0)), 1e-12),
            1
          )

      # Multi-window API availability ratios (1.0 when zero errors / idle)
      - record: orynx:api:availability:ratio_rate5m
        expr: 1 - orynx:api:error_ratio:rate5m

      - record: orynx:api:availability:ratio_rate1h
        expr: 1 - orynx:api:error_ratio:rate1h

      - record: orynx:api:availability:ratio_rate6h
        expr: 1 - orynx:api:error_ratio:rate6h

      - record: orynx:api:availability:ratio_rate24h
        expr: 1 - orynx:api:error_ratio:rate24h

      - record: orynx:api:availability:ratio_rate7d
        expr: 1 - orynx:api:error_ratio:rate7d

      - record: orynx:api:availability:ratio_rate30d
        expr: 1 - orynx:api:error_ratio:rate30d

      # API Latency SLIs (P95, P99, and Average in seconds, excluding /actuator.*)
      - record: orynx:api:latency_p95:rate5m
        expr: >-
          (
            histogram_quantile(
              0.95,
              sum by (le) (rate(http_server_requests_seconds_bucket{uri!~"/actuator.*"}[5m]))
            ) < 1e9
          )
          or
          (
            (sum(rate(http_server_requests_seconds_sum{uri!~"/actuator.*"}[5m])) or vector(0))
            /
            clamp_min((sum(rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[5m])) or vector(0)), 1e-12)
          )

      - record: orynx:api:latency_p99:rate5m
        expr: >-
          (
            histogram_quantile(
              0.99,
              sum by (le) (rate(http_server_requests_seconds_bucket{uri!~"/actuator.*"}[5m]))
            ) < 1e9
          )
          or
          (
            (sum(rate(http_server_requests_seconds_sum{uri!~"/actuator.*"}[5m])) or vector(0))
            /
            clamp_min((sum(rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[5m])) or vector(0)), 1e-12)
          )

      # API Error Budget Remaining (1.0 = 100% left, 0.0 = exhausted) & Burn Rates (1.0 = 1x budget burn)
      - record: orynx:api:error_budget_remaining:ratio_30d
        expr: >-
          clamp_min(
            clamp_max(
              1 - (orynx:api:error_ratio:rate30d / (1 - 0.999)),
              1
            ),
            0
          )

      - record: orynx:api:burn_rate:5m
        expr: orynx:api:error_ratio:rate5m / (1 - 0.999)

      - record: orynx:api:burn_rate:30m
        expr: orynx:api:error_ratio:rate30m / (1 - 0.999)

      - record: orynx:api:burn_rate:1h
        expr: orynx:api:error_ratio:rate1h / (1 - 0.999)

      - record: orynx:api:burn_rate:6h
        expr: orynx:api:error_ratio:rate6h / (1 - 0.999)

  # ============================================================================
  # 2. Workflow Orchestration SLIs, SLO Targets, Error Budgets & Burn Rates
  #    Target Completion Reliability: 99.0% (0.99) | Error Budget: 1.0% (0.01)
  #    Target P95 Duration:           30.0s
  # ============================================================================
  - name: orynx_workflow_sli_rules
    interval: 15s
    rules:
      - record: orynx:workflow:slo_target_success_ratio
        expr: vector(0.99)

      - record: orynx:workflow:slo_target_p95_seconds
        expr: vector(30.0)

      - record: orynx:workflow:created:rate5m
        expr: sum(rate(orynx_workflows_total[5m])) or vector(0)

      - record: orynx:workflow:started:rate5m
        expr: sum(rate(orynx_workflows_started_total[5m])) or vector(0)

      - record: orynx:workflow:completed:rate5m
        expr: sum(rate(orynx_workflows_completed_total{status="COMPLETED"}[5m])) or vector(0)

      - record: orynx:workflow:failed:rate5m
        expr: sum(rate(orynx_workflows_completed_total{status="FAILED"}[5m])) or vector(0)

      - record: orynx:workflow:cancelled:rate5m
        expr: sum(rate(orynx_workflows_cancelled_total[5m])) or vector(0)

      - record: orynx:workflow:retried:rate5m
        expr: sum(rate(orynx_workflows_retried_total[5m])) or vector(0)

      - record: orynx:workflow:retry_ratio:rate5m
        expr: >-
          clamp_max(
            (sum(rate(orynx_workflows_retried_total[5m])) or vector(0))
            /
            clamp_min((sum(rate(orynx_workflows_started_total[5m])) or vector(0)), 1e-12),
            1
          )

      # Multi-window workflow failure ratios: FAILED / (COMPLETED + FAILED)
      - record: orynx:workflow:failure_ratio:rate5m
        expr: >-
          clamp_max(
            (sum(rate(orynx_workflows_completed_total{status="FAILED"}[5m])) or vector(0))
            /
            clamp_min((sum(rate(orynx_workflows_completed_total{status=~"COMPLETED|FAILED"}[5m])) or vector(0)), 1e-12),
            1
          )

      - record: orynx:workflow:failure_ratio:rate30m
        expr: >-
          clamp_max(
            (sum(rate(orynx_workflows_completed_total{status="FAILED"}[30m])) or vector(0))
            /
            clamp_min((sum(rate(orynx_workflows_completed_total{status=~"COMPLETED|FAILED"}[30m])) or vector(0)), 1e-12),
            1
          )

      - record: orynx:workflow:failure_ratio:rate1h
        expr: >-
          clamp_max(
            (sum(rate(orynx_workflows_completed_total{status="FAILED"}[1h])) or vector(0))
            /
            clamp_min((sum(rate(orynx_workflows_completed_total{status=~"COMPLETED|FAILED"}[1h])) or vector(0)), 1e-12),
            1
          )

      - record: orynx:workflow:failure_ratio:rate6h
        expr: >-
          clamp_max(
            (sum(rate(orynx_workflows_completed_total{status="FAILED"}[6h])) or vector(0))
            /
            clamp_min((sum(rate(orynx_workflows_completed_total{status=~"COMPLETED|FAILED"}[6h])) or vector(0)), 1e-12),
            1
          )

      - record: orynx:workflow:failure_ratio:rate24h
        expr: >-
          clamp_max(
            (sum(rate(orynx_workflows_completed_total{status="FAILED"}[24h])) or vector(0))
            /
            clamp_min((sum(rate(orynx_workflows_completed_total{status=~"COMPLETED|FAILED"}[24h])) or vector(0)), 1e-12),
            1
          )

      - record: orynx:workflow:failure_ratio:rate7d
        expr: >-
          clamp_max(
            (sum(rate(orynx_workflows_completed_total{status="FAILED"}[7d])) or vector(0))
            /
            clamp_min((sum(rate(orynx_workflows_completed_total{status=~"COMPLETED|FAILED"}[7d])) or vector(0)), 1e-12),
            1
          )

      - record: orynx:workflow:failure_ratio:rate30d
        expr: >-
          clamp_max(
            (sum(rate(orynx_workflows_completed_total{status="FAILED"}[30d])) or vector(0))
            /
            clamp_min((sum(rate(orynx_workflows_completed_total{status=~"COMPLETED|FAILED"}[30d])) or vector(0)), 1e-12),
            1
          )

      # Multi-window workflow completion success ratios
      - record: orynx:workflow:success_ratio:rate5m
        expr: 1 - orynx:workflow:failure_ratio:rate5m

      - record: orynx:workflow:success_ratio:rate1h
        expr: 1 - orynx:workflow:failure_ratio:rate1h

      - record: orynx:workflow:success_ratio:rate6h
        expr: 1 - orynx:workflow:failure_ratio:rate6h

      - record: orynx:workflow:success_ratio:rate24h
        expr: 1 - orynx:workflow:failure_ratio:rate24h

      - record: orynx:workflow:success_ratio:rate7d
        expr: 1 - orynx:workflow:failure_ratio:rate7d

      - record: orynx:workflow:success_ratio:rate30d
        expr: 1 - orynx:workflow:failure_ratio:rate30d

      # Workflow Duration SLIs (Average and P95 in seconds)
      - record: orynx:workflow:duration_avg_seconds:rate5m
        expr: >-
          (sum(rate(orynx_workflows_duration_seconds_sum[5m])) or vector(0))
          /
          clamp_min((sum(rate(orynx_workflows_duration_seconds_count[5m])) or vector(0)), 1e-12)

      - record: orynx:workflow:duration_p95_seconds:rate5m
        expr: >-
          (
            histogram_quantile(
              0.95,
              sum by (le) (rate(orynx_workflows_duration_seconds_bucket[5m]))
            ) < 1e9
          )
          or orynx:workflow:duration_avg_seconds:rate5m

      # Workflow Error Budget Remaining & Burn Rates
      - record: orynx:workflow:error_budget_remaining:ratio_30d
        expr: >-
          clamp_min(
            clamp_max(
              1 - (orynx:workflow:failure_ratio:rate30d / (1 - 0.99)),
              1
            ),
            0
          )

      - record: orynx:workflow:burn_rate:5m
        expr: orynx:workflow:failure_ratio:rate5m / (1 - 0.99)

      - record: orynx:workflow:burn_rate:30m
        expr: orynx:workflow:failure_ratio:rate30m / (1 - 0.99)

      - record: orynx:workflow:burn_rate:1h
        expr: orynx:workflow:failure_ratio:rate1h / (1 - 0.99)

      - record: orynx:workflow:burn_rate:6h
        expr: orynx:workflow:failure_ratio:rate6h / (1 - 0.99)

  # ============================================================================
  # 3. Task Execution SLIs, SLO Targets, Error Budgets & Burn Rates
  #    Target Task Execution Success: 99.0% (0.99) | Error Budget: 1.0% (0.01)
  # ============================================================================
  - name: orynx_task_sli_rules
    interval: 15s
    rules:
      - record: orynx:task:slo_target_success_ratio
        expr: vector(0.99)

      - record: orynx:task:executed:rate5m
        expr: sum(rate(orynx_tasks_executed_total[5m])) or vector(0)

      - record: orynx:task:completed:rate5m
        expr: sum(rate(orynx_tasks_executed_total{status="COMPLETED"}[5m])) or vector(0)

      - record: orynx:task:failed:rate5m
        expr: sum(rate(orynx_tasks_executed_total{status="FAILED"}[5m])) or vector(0)

      - record: orynx:task:failure_ratio:rate5m
        expr: >-
          clamp_max(
            (sum(rate(orynx_tasks_executed_total{status="FAILED"}[5m])) or vector(0))
            /
            clamp_min((sum(rate(orynx_tasks_executed_total{status=~"COMPLETED|FAILED"}[5m])) or vector(0)), 1e-12),
            1
          )

      - record: orynx:task:failure_ratio:rate30m
        expr: >-
          clamp_max(
            (sum(rate(orynx_tasks_executed_total{status="FAILED"}[30m])) or vector(0))
            /
            clamp_min((sum(rate(orynx_tasks_executed_total{status=~"COMPLETED|FAILED"}[30m])) or vector(0)), 1e-12),
            1
          )

      - record: orynx:task:failure_ratio:rate1h
        expr: >-
          clamp_max(
            (sum(rate(orynx_tasks_executed_total{status="FAILED"}[1h])) or vector(0))
            /
            clamp_min((sum(rate(orynx_tasks_executed_total{status=~"COMPLETED|FAILED"}[1h])) or vector(0)), 1e-12),
            1
          )

      - record: orynx:task:failure_ratio:rate6h
        expr: >-
          clamp_max(
            (sum(rate(orynx_tasks_executed_total{status="FAILED"}[6h])) or vector(0))
            /
            clamp_min((sum(rate(orynx_tasks_executed_total{status=~"COMPLETED|FAILED"}[6h])) or vector(0)), 1e-12),
            1
          )

      - record: orynx:task:failure_ratio:rate30d
        expr: >-
          clamp_max(
            (sum(rate(orynx_tasks_executed_total{status="FAILED"}[30d])) or vector(0))
            /
            clamp_min((sum(rate(orynx_tasks_executed_total{status=~"COMPLETED|FAILED"}[30d])) or vector(0)), 1e-12),
            1
          )

      - record: orynx:task:success_ratio:rate5m
        expr: 1 - orynx:task:failure_ratio:rate5m

      - record: orynx:task:success_ratio:rate1h
        expr: 1 - orynx:task:failure_ratio:rate1h

      - record: orynx:task:success_ratio:rate30d
        expr: 1 - orynx:task:failure_ratio:rate30d

      - record: orynx:task:error_budget_remaining:ratio_30d
        expr: >-
          clamp_min(
            clamp_max(
              1 - (orynx:task:failure_ratio:rate30d / (1 - 0.99)),
              1
            ),
            0
          )

      - record: orynx:task:burn_rate:5m
        expr: orynx:task:failure_ratio:rate5m / (1 - 0.99)

      - record: orynx:task:burn_rate:1h
        expr: orynx:task:failure_ratio:rate1h / (1 - 0.99)

  # ============================================================================
  # 4. Infrastructure & Observability Pipeline SLIs
  # ============================================================================
  - name: orynx_infrastructure_sli_rules
    interval: 15s
    rules:
      - record: orynx:backend:availability_ratio
        expr: >-
          (count(up{job="orynx-backend"} == 1) or vector(0))
          /
          clamp_min((count(up{job="orynx-backend"}) or vector(5)), 1)

      - record: orynx:postgres:connection_utilization_ratio
        expr: >-
          clamp_max(
            (sum(pg_stat_activity_count) or vector(0))
            /
            clamp_min((max(pg_settings_max_connections) or vector(100)), 1),
            1
          )

      - record: orynx:kafka:consumer_lag:by_group_topic
        expr: >-
          sum by (consumergroup, topic) (kafka_consumergroup_lag)

      - record: orynx:kafka:consumer_lag:max
        expr: >-
          max(sum by (consumergroup, topic) (kafka_consumergroup_lag)) or vector(0)

      - record: orynx:otel:export_failure_ratio:rate5m
        expr: >-
          clamp_max(
            (sum(rate(otelcol_exporter_send_failed_spans_total[5m])) or vector(0))
            /
            clamp_min(
              ((sum(rate(otelcol_exporter_sent_spans_total[5m])) or vector(0))
              + (sum(rate(otelcol_exporter_send_failed_spans_total[5m])) or vector(0))),
              1e-12
            ),
            1
          )

      - record: orynx:otel:export_success_ratio:rate5m
        expr: 1 - orynx:otel:export_failure_ratio:rate5m
