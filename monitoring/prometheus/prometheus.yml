global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: orynx-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - "gateway-service:9100"
          - "auth-service:9100"
          - "orchestrator-service:9100"
          - "planning-service:9100"
          - "execution-service:9100"

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis-exporter
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]
