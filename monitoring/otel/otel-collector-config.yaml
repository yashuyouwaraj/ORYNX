extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  filter/healthchecks:
    error_mode: ignore
    traces:
      span:
        - 'IsMatch(name, ".*actuator/health.*")'
        - 'IsMatch(attributes["url.path"], "^/actuator/health.*")'
        - 'IsMatch(attributes["http.target"], "^/actuator/health.*")'
        - 'IsMatch(attributes["http.route"], "^/actuator/health.*")'
  attributes/redact_traces:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.request.header.x_api_key
        action: delete
      - key: db.user
        action: delete
      - key: password
        action: delete
      - key: secret
        action: delete
      - key: token
        action: delete
  transform/redact_logs:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - replace_pattern(body, "(?s)-----BEGIN [A-Z ]*PRIVATE KEY-----.*?-----END [A-Z ]*PRIVATE KEY-----", "[REDACTED_PRIVATE_KEY]")
          - replace_pattern(body, "([a-zA-Z][a-zA-Z0-9+.-]*://)[^\\s/@:]+:[^\\s/@]+@", "$$1[REDACTED]@")
          - replace_pattern(body, "(?i)(\"?[A-Za-z0-9_.-]*(?:password|passwd|pwd|secret|token|api[_-]?key|access[_-]?key|private[_-]?key|authorization|jwt|credentials?)(?:[_-]?value)?\"?\\s*[:=]\\s*\")((?:\\\\.|[^\"\\\\\\r\\n])+)(\")", "$$1[REDACTED]$$3")
          - replace_pattern(body, "(?i)('?[A-Za-z0-9_.-]*(?:password|passwd|pwd|secret|token|api[_-]?key|access[_-]?key|private[_-]?key|authorization|jwt|credentials?)(?:[_-]?value)?'?\\s*[:=]\\s*')((?:\\\\.|[^'\\\\\\r\\n])+)(')", "$$1[REDACTED]$$3")
          - replace_pattern(body, "(?i)([A-Za-z0-9_.-]*authorization\\s*[:=]\\s*)(?:(?:Bearer|Basic|Digest|Token|ApiKey)\\s+)?[^\\s,;\"'&\\]})]+", "$$1[REDACTED]")
          - replace_pattern(body, "(?i)\\b(Bearer|Basic)\\s+[A-Za-z0-9\\-._~+/]{6,}={0,2}(\\s|$|[,;\"'&\\]})])", "$$1 [REDACTED]$$2")
          - replace_pattern(body, "(?i)([A-Za-z0-9_.-]*(?:password|passwd|pwd|secret|token|api[_-]?key|access[_-]?key|private[_-]?key|jwt|credentials?)(?:[_-]?value)?\\s*[:=]\\s*)[^\\s,;\"'&\\]})]+", "$$1[REDACTED]")
          - replace_pattern(body, "eyJ[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}", "[REDACTED_JWT]")
          - replace_pattern(body, "[\\r\\n]+", " ")
          - delete_key(attributes, "authorization")
          - delete_key(attributes, "password")
          - delete_key(attributes, "passwd")
          - delete_key(attributes, "secret")
          - delete_key(attributes, "token")
          - delete_key(attributes, "api_key")
          - delete_key(attributes, "cookie")
          - delete_key(attributes, "x_api_key")
          - delete_key(attributes, "x-api-key")
  batch:
    timeout: 2s
    send_batch_size: 512
    send_batch_max_size: 1024

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    timeout: 5s
    retry_on_failure:
      enabled: true
      initial_interval: 2s
      max_interval: 15s
      max_elapsed_time: 60s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 512
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true
    timeout: 5s
    retry_on_failure:
      enabled: true
      initial_interval: 2s
      max_interval: 15s
      max_elapsed_time: 60s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 512

service:
  extensions: [health_check]
  telemetry:
    metrics:
      address: 0.0.0.0:8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/healthchecks, attributes/redact_traces, batch]
      exporters: [otlp/tempo]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, transform/redact_logs, batch]
      exporters: [otlphttp/loki]
