extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  filter/healthchecks:
    error_mode: ignore
    traces:
      span:
        - 'IsMatch(name, ".*actuator/health.*")'
        - 'IsMatch(attributes["url.path"], "^/actuator/health.*")'
        - 'IsMatch(attributes["http.target"], "^/actuator/health.*")'
        - 'IsMatch(attributes["http.route"], "^/actuator/health.*")'
  batch:
    timeout: 2s
    send_batch_size: 512

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  extensions: [health_check]
  telemetry:
    metrics:
      address: 0.0.0.0:8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/healthchecks, batch]
      exporters: [otlp/tempo]
