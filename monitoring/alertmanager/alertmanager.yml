global:
  resolve_timeout: 5m

route:
  receiver: default-webhook
  group_by:
    - alertname
    - service
    - category
  group_wait: 15s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = "critical"
      receiver: critical-webhook
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 1h
      continue: false
    - matchers:
        - category = "slo"
      receiver: slo-webhook
      group_wait: 15s
      group_interval: 1m
      repeat_interval: 2h
      continue: false
    - matchers:
        - category =~ "workflow|task"
      receiver: workflow-webhook
      group_wait: 15s
      group_interval: 1m
      repeat_interval: 2h
      continue: false
    - matchers:
        - category =~ "infrastructure|platform"
      receiver: infrastructure-webhook
      group_wait: 15s
      group_interval: 1m
      repeat_interval: 2h
      continue: false
    - matchers:
        - severity = "warning"
      receiver: warning-webhook
      group_wait: 30s
      group_interval: 2m
      repeat_interval: 4h
      continue: false

inhibit_rules:
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal:
      - service
      - category
  - source_matchers:
      - alertname =~ "PostgreSQLUnavailable|KafkaUnavailable|RedisUnavailable"
    target_matchers:
      - category =~ "workflow|task|slo"
    equal: []
  - source_matchers:
      - alertname = "BackendServiceDown"
    target_matchers:
      - category =~ "slo|workflow|task"
    equal:
      - service

receivers:
  - name: default-webhook
    webhook_configs:
      - url: "http://127.0.0.1:9093/-/healthy"
        send_resolved: true
  - name: critical-webhook
    webhook_configs:
      - url: "http://127.0.0.1:9093/-/healthy"
        send_resolved: true
  - name: slo-webhook
    webhook_configs:
      - url: "http://127.0.0.1:9093/-/healthy"
        send_resolved: true
  - name: workflow-webhook
    webhook_configs:
      - url: "http://127.0.0.1:9093/-/healthy"
        send_resolved: true
  - name: infrastructure-webhook
    webhook_configs:
      - url: "http://127.0.0.1:9093/-/healthy"
        send_resolved: true
  - name: warning-webhook
    webhook_configs:
      - url: "http://127.0.0.1:9093/-/healthy"
        send_resolved: true
