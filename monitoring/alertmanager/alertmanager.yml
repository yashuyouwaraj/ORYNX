global:
  resolve_timeout: 5m

route:
  receiver: default-webhook
  group_by:
    - alertname
    - service
    - category
  group_wait: 15s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = "critical"
      receiver: critical-webhook
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 1h
      continue: false
    - matchers:
        - category = "slo"
      receiver: slo-webhook
      group_wait: 15s
      group_interval: 1m
      repeat_interval: 2h
      continue: false
    - matchers:
        - category =~ "workflow|task"
      receiver: workflow-webhook
      group_wait: 15s
      group_interval: 1m
      repeat_interval: 2h
      continue: false
    - matchers:
        - category =~ "infrastructure|platform"
      receiver: infrastructure-webhook
      group_wait: 15s
      group_interval: 1m
      repeat_interval: 2h
      continue: false
    - matchers:
        - severity = "warning"
      receiver: warning-webhook
      group_wait: 30s
      group_interval: 2m
      repeat_interval: 4h
      continue: false

inhibit_rules:
  # 1. Any critical alert suppresses warning alerts for the exact same (service, category).
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal:
      - service
      - category

  # 2. Core backing-store outages (PostgreSQL/Kafka) suppress warning-level workflow/task symptoms
  #    while keeping critical workflow, task, and SLO alerts visible.
  - source_matchers:
      - alertname =~ "PostgreSQLUnavailable|KafkaUnavailable"
    target_matchers:
      - severity = "warning"
      - category =~ "workflow|task"
    equal: []

  # 3. A down backend service suppresses warning-level workflow/task/SLO symptoms for that service
  #    while preserving critical alerts.
  - source_matchers:
      - alertname = "BackendServiceDown"
    target_matchers:
      - severity = "warning"
      - category =~ "slo|workflow|task"
    equal:
      - service

  # 4. Specific target-down alerts suppress the generic PrometheusTargetDown fallback for the same instance.
  - source_matchers:
      - alertname =~ "BackendServiceDown|OtelCollectorDown|PostgresExporterDown|RedisExporterDown|KafkaExporterDown|AlertmanagerDown"
    target_matchers:
      - alertname = "PrometheusTargetDown"
    equal:
      - instance

receivers:
  - name: default-webhook
    # __WEBHOOK_SLOT__
  - name: critical-webhook
    # __WEBHOOK_SLOT__
  - name: slo-webhook
    # __WEBHOOK_SLOT__
  - name: workflow-webhook
    # __WEBHOOK_SLOT__
  - name: infrastructure-webhook
    # __WEBHOOK_SLOT__
  - name: warning-webhook
    # __WEBHOOK_SLOT__
