spring.application.name=planning-service

server.port=8083

#Nvidia
nvidia.api.url=https://integrate.api.nvidia.com/v1/chat/completions

nvidia.api.key=${NVIDIA_API_KEY}

##################################################
# Actuator
##################################################

management.endpoints.web.exposure.include=health
management.endpoints.web.exposure.exclude=env,configprops,beans,mappings,heapdump,threaddump,loggers,shutdown,conditions,scheduledtasks,info
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
