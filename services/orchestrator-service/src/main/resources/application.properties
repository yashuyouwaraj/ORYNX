spring.application.name=orchestrator-service

server.port=8082

##################################################
# Planning Service
##################################################

planning.service.url=${PLANNING_SERVICE_URL:http://localhost:8083}
planning.service.connect-timeout=5000
planning.service.read-timeout=10000

##################################################
# PostgreSQL
##################################################

spring.datasource.url=jdbc:postgresql://localhost:5432/orynx
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

##################################################
# Redis Coordination & Admission Control
##################################################

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.timeout=${SPRING_DATA_REDIS_TIMEOUT:2000ms}
spring.data.redis.lettuce.pool.max-active=${SPRING_DATA_REDIS_POOL_MAX_ACTIVE:16}
spring.data.redis.lettuce.pool.max-idle=${SPRING_DATA_REDIS_POOL_MAX_IDLE:8}
spring.data.redis.lettuce.pool.min-idle=${SPRING_DATA_REDIS_POOL_MIN_IDLE:2}
spring.data.redis.lettuce.shutdown-timeout=${SPRING_DATA_REDIS_SHUTDOWN_TIMEOUT:100ms}

orynx.admission.enabled=${ORYNX_ADMISSION_ENABLED:true}
orynx.admission.max-global-concurrent-workflows=${ORYNX_ADMISSION_MAX_GLOBAL:100}
orynx.admission.max-user-concurrent-workflows=${ORYNX_ADMISSION_MAX_PER_USER:10}
orynx.admission.workflow-lease-ttl-seconds=${ORYNX_ADMISSION_LEASE_TTL:3600}
orynx.admission.failure-policy=${ORYNX_ADMISSION_FAILURE_POLICY:FAIL_CLOSED}
orynx.admission.retry-after-seconds=${ORYNX_ADMISSION_RETRY_AFTER:5}
orynx.admission.reconciliation-interval-seconds=${ORYNX_ADMISSION_RECONCILIATION_INTERVAL:60}

##################################################
# JPA
##################################################

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

##################################################
# Kafka
##################################################

spring.kafka.bootstrap-servers=localhost:29092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.delivery.timeout.ms=30000
spring.kafka.producer.properties.request.timeout.ms=10000
spring.kafka.producer.properties.retry.backoff.ms=500
spring.kafka.producer.properties.spring.json.add.type.headers=true

# Consumer
spring.kafka.consumer.group-id=orynx-orchestrator-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.use.type.headers=false

spring.kafka.consumer.properties.spring.json.trusted.packages=*

##################################################
# Actuator
##################################################

management.endpoints.web.exposure.include=health
management.endpoints.web.exposure.exclude=env,configprops,beans,mappings,heapdump,threaddump,loggers,shutdown,conditions,scheduledtasks,info
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true

##################################################
# Observability (Metrics)
##################################################

management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

##################################################
# Logging
##################################################

logging.level.org.springframework.kafka=INFO

##################################################
# NVIDIA
##################################################

nvidia.api.url=https://integrate.api.nvidia.com/v1/chat/completions
nvidia.api.key=${NVIDIA_API_KEY}

##################################################
# Resilience4j - Circuit Breaker
##################################################

resilience4j.circuitbreaker.instances.planningService.register-health-indicator=true
resilience4j.circuitbreaker.instances.planningService.sliding-window-size=10
resilience4j.circuitbreaker.instances.planningService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.planningService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.planningService.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.planningService.permitted-number-of-calls-in-half-open-state=3

##################################################
# Resilience4j - Retry
##################################################

resilience4j.retry.instances.planningService.max-attempts=3
resilience4j.retry.instances.planningService.wait-duration=2s
resilience4j.retry.instances.planningService.enable-exponential-backoff=true
resilience4j.retry.instances.planningService.exponential-backoff-multiplier=2

##################################################
# JWT
##################################################

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}