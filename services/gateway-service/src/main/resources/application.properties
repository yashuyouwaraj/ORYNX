spring.application.name=gateway-service

server.port=8080

management.endpoints.web.exposure.include=health
management.endpoints.web.exposure.exclude=env,configprops,beans,mappings,heapdump,threaddump,loggers,shutdown,conditions,scheduledtasks,info,gateway
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.gateway.access=none

##################################################
# AUTH SERVICE
##################################################

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=${AUTH_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=user-service
spring.cloud.gateway.server.webflux.routes[1].uri=${AUTH_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/users/**

##################################################
# ORCHESTRATOR SERVICE
##################################################

spring.cloud.gateway.server.webflux.routes[2].id=orchestrator-workflows
spring.cloud.gateway.server.webflux.routes[2].uri=${ORCHESTRATOR_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/workflows/**

spring.cloud.gateway.server.webflux.routes[3].id=orchestrator-ai
spring.cloud.gateway.server.webflux.routes[3].uri=${ORCHESTRATOR_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/ai/**

spring.cloud.gateway.server.webflux.routes[4].id=orchestrator-platform
spring.cloud.gateway.server.webflux.routes[4].uri=${ORCHESTRATOR_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/v1/platform/**

spring.cloud.gateway.server.webflux.routes[5].id=orchestrator-analytics
spring.cloud.gateway.server.webflux.routes[5].uri=${ORCHESTRATOR_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/v1/analytics/**

spring.cloud.gateway.server.webflux.routes[6].id=orchestrator-performance
spring.cloud.gateway.server.webflux.routes[6].uri=${ORCHESTRATOR_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/v1/performance/**

spring.cloud.gateway.server.webflux.routes[7].id=orchestrator-timeline
spring.cloud.gateway.server.webflux.routes[7].uri=${ORCHESTRATOR_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/v1/timeline/**

spring.cloud.gateway.server.webflux.routes[8].id=orchestrator-websocket
spring.cloud.gateway.server.webflux.routes[8].uri=${ORCHESTRATOR_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/ws/**,/ws

##################################################
# PLANNING SERVICE
##################################################

spring.cloud.gateway.server.webflux.routes[9].id=planning-service
spring.cloud.gateway.server.webflux.routes[9].uri=${PLANNING_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webflux.routes[9].predicates[0]=Path=/api/v1/plans/**

##################################################
# JWT
##################################################

jwt.secret=${JWT_SECRET}

##################################################
# OBSERVABILITY (METRICS)
##################################################
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
