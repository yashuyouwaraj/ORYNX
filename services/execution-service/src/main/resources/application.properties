spring.application.name=execution-service

server.port=8084

##################################################
# PostgreSQL
##################################################

spring.datasource.url=jdbc:postgresql://localhost:5432/orynx
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

##################################################
# JPA
##################################################

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

##################################################
# Actuator
##################################################

management.endpoints.web.exposure.include=*

##################################################
# Kafka Consumer
##################################################

spring.kafka.bootstrap-servers=localhost:29092

spring.kafka.consumer.group-id=execution-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=manual_immediate

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.value.default.type=com.orynx.execution.workflow.event.WorkflowExecutionRequestEvent

spring.kafka.consumer.properties.spring.json.use.type.headers=true

spring.kafka.consumer.properties.spring.json.type.mapping=com.orynx.orchestrator.event.dto.WorkflowCancelledEvent:com.orynx.execution.event.dto.WorkflowCancelledEvent,com.orynx.orchestrator.workflow.event.WorkflowExecutionRequestEvent:com.orynx.execution.workflow.event.WorkflowExecutionRequestEvent,com.orynx.orchestrator.event.dto.WorkflowPausedEvent:com.orynx.execution.event.dto.WorkflowPausedEvent

spring.kafka.consumer.properties.spring.json.trusted.packages=*

##################################################
# Kafka Producer
##################################################

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.producer.properties.spring.json.add.type.headers=true

##################################################
# Worker Pool & Execution Coordination
##################################################

orynx.execution.worker.core-pool-size=${ORYNX_EXECUTION_WORKER_CORE_POOL_SIZE:4}
orynx.execution.worker.max-pool-size=${ORYNX_EXECUTION_WORKER_MAX_POOL_SIZE:8}
orynx.execution.worker.queue-capacity=${ORYNX_EXECUTION_WORKER_QUEUE_CAPACITY:50}
orynx.execution.worker.keep-alive-seconds=60
orynx.execution.worker.await-termination-seconds=30
orynx.execution.worker.lease-duration-seconds=300
orynx.execution.worker.heartbeat-interval-seconds=30
orynx.execution.worker.recovery-enabled=true
orynx.execution.worker.recovery-interval-seconds=60
orynx.execution.worker.max-recovery-attempts=3
